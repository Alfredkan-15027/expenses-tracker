name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Privacy & security audit
        run: npm run check:security

      # Pull requests from Codex (branch names starting with "codex") may only touch the design layer.
      - name: Codex scope guard
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex')
        run: node scripts/check-codex-scope.mjs --base "origin/${{ github.base_ref }}"
